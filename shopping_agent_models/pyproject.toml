[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-agent-models"
version = "0.1.0"
description = "Shared models and interfaces for shopping agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]